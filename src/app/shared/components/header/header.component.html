<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand__mark" aria-hidden="true">🚗</span>
      <span class="brand__text">
        <span class="brand__name">{{ config.appName }}</span>
        <span class="brand__tag">{{ config.tagline }}</span>
      </span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-controls="primary-nav"
    >
      Menu
    </button>

    <nav id="primary-nav" class="nav" [class.open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/centers" routerLinkActive="active" (click)="closeMenu()">Driving centers</a>
      <a routerLink="/pricing" routerLinkActive="active" (click)="closeMenu()">Pricing</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-cta" (click)="closeMenu()">Contact</a>
    </nav>
  </div>
</header>
